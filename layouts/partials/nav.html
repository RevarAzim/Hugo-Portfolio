<nav class="nav" aria-label="Primary">
  <ul>
    {{- range site.Menus.main }}
    {{- $current := $.IsMenuCurrent .Menu . -}}
    {{- $ancestor := $.HasMenuCurrent .Menu . -}}
    <li>
      <a href="{{ .URL }}"{{ if $current }} aria-current="page"{{ else if $ancestor }} aria-current="true"{{ end }}>{{ .Name }}</a>
    </li>
    {{- end }}
  </ul>
</nav>
