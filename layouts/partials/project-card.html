{{- $page := .page -}}
<article class="project-card">
  <h{{ .level }}><a href="{{ $page.RelPermalink }}">{{ $page.Title }}</a></h{{ .level }}>
  {{- with $page.Params.status }}
  <p class="status">{{ . }}</p>
  {{- end }}
  {{- with $page.Description }}
  <p>{{ . }}</p>
  {{- end }}
  {{- with $page.Params.technologies }}
  <p class="technologies">{{ delimit . ", " }}</p>
  {{- end }}
</article>
