{{ define "main" }}
<article>
  <header class="page-intro">
    <h1>{{ .Title }}</h1>
    {{- with .Params.dek }}<p class="dek">{{ . }}</p>{{ end }}
    {{- with .Params.status }}<p class="status">{{ . }}</p>{{ end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
  {{- with .Params.technologies }}
  <p class="technologies">{{ delimit . ", " }}</p>
  {{- end }}
  <p class="back-link no-print"><a href="{{ "projects/" | relURL }}">All projects</a></p>
</article>
{{ end }}
