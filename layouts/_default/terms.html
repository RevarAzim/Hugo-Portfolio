{{ define "main" }}
<header class="page-intro">
  <h1>{{ .Title }}</h1>
</header>
<ul class="tag-index-list">
  {{- range .Data.Terms.Alphabetical }}
  <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a> ({{ .Count }})</li>
  {{- end }}
</ul>
<p class="back-link no-print"><a href="{{ "projects/" | relURL }}">All projects</a></p>
{{ end }}
