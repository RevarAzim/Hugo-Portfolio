{{ define "main" }}
<header class="page-intro">
  <h1>Projects tagged {{ .Title }}</h1>
  <p class="status">{{ len .Pages }} {{ if eq (len .Pages) 1 }}project{{ else }}projects{{ end }}</p>
</header>
<section class="project-list" aria-label="Projects">
  {{- range .Pages.ByWeight }}
    {{- partial "project-card.html" (dict "page" . "level" 2) -}}
  {{- end }}
</section>
<p class="back-link no-print"><a href="{{ "projects/" | relURL }}">All projects</a></p>
{{ end }}
